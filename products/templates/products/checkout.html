{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
    <link rel="stylesheet" href="{% static 'products/css/product_list.css' %}">
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand" href="/">
            E-Commerce Store
        </a>

        <a href="{% url 'cart' %}" class="btn btn-light">
            🛒 Cart ({{ cart_count }})
        </a>

    </div>
</nav>


<div class="container py-5 checkout-page">

    <h1 class="mb-4">
        Checkout
    </h1>

    <div class="row">

        <!-- Customer Details -->

        <div class="col-md-7">

            <div class="card shadow checkout-card">

                <div class="card-body">

                    <h4 class="mb-4">
                        Customer Details
                    </h4>

                    <form method="POST">

                        {% csrf_token %}

                        <div class="mb-3">

                            <label class="form-label">
                                Full Name
                            </label>

                            <input
                                type="text"
                                name="customer_name"
                                class="form-control"
                                placeholder="Enter your name"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Phone
                            </label>

                            <input
                                type="tel"
                                name="phone"
                                class="form-control"
                                placeholder="Enter phone number"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Email
                            </label>

                            <input
                                type="email"
                                name="email"
                                class="form-control"
                                placeholder="Enter email"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Address
                            </label>

                            <textarea
                                name="address"
                                class="form-control"
                                rows="4"
                                placeholder="Enter delivery address"
                                required
                            ></textarea>

                        </div>


                        <button
                            type="submit"
                            class="btn btn-success w-100"
                        >
                            Proceed to Payment
                        </button>

                    </form>

                </div>

            </div>

        </div>


        <!-- Order Summary -->

        <div class="col-md-5">

            <div class="card shadow checkout-card order-summary-card">

                <div class="card-body">

                    <h4 class="mb-4">
                        Order Summary
                    </h4>


                    {% for item in cart_items %}

                    <div class="d-flex justify-content-between mb-3">

                        <div>

                            <strong>
                                {{ item.product.name }}
                            </strong>

                            <br>

                            <small class="text-muted">
                                Qty: {{ item.quantity }}
                            </small>

                        </div>

                        <span>
                            ₹{{ item.product.price }}
                        </span>

                    </div>

                    {% endfor %}


                    <hr>


                    <div class="d-flex justify-content-between">

                        <strong>
                            Total
                        </strong>

                        <strong>
                            ₹{{ total }}
                        </strong>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
