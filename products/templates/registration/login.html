{% load static %}
<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Customer Login</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
    }

    body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;

    background-image:
        linear-gradient(
            rgba(0, 0, 0, 0.45),
            rgba(0, 0, 0, 0.45)
        ),
        url("{% static 'products/images/login-bg.jpg' %}");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
}

    .login-container {
        width: 390px;
        background: white;
        padding: 35px;
        border-radius: 18px;
        box-shadow: 0 15px 40px rgba(0,0,0,0.25);
    }

    .login-container h1 {
        text-align: center;
        margin-bottom: 8px;
        color: #333;
    }

    .subtitle {
        text-align: center;
        color: #777;
        margin-bottom: 28px;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        margin-bottom: 7px;
        font-weight: bold;
        color: #444;
    }

    .form-group input {
        width: 100%;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 9px;
        outline: none;
        font-size: 15px;
    }

    .form-group input:focus {
        border-color: #667eea;
        box-shadow: 0 0 5px rgba(102,126,234,0.3);
    }

    .error {
        background: #ffe5e5;
        color: #c0392b;
        padding: 10px;
        border-radius: 8px;
        margin-bottom: 18px;
        text-align: center;
    }

    .login-btn {
        width: 100%;
        padding: 13px;
        border: none;
        border-radius: 9px;
        background: #667eea;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    .login-btn:hover {
        background: #5568d9;
    }

    .bottom-text {
        text-align: center;
        margin-top: 20px;
        color: #777;
        font-size: 14px;
    }
</style>

</head><body><div class="login-container"><h1>Customer Login</h1>

<p class="subtitle">
    Login to continue shopping
</p>

{% if form.errors %}
    <div class="error">
        Invalid username or password.
        Please try again.
    </div>
{% endif %}

<form method="post">
    {% csrf_token %}

    <div class="form-group">
        <label for="id_username">Username</label>
        {{ form.username }}
    </div>

    <div class="form-group">
        <label for="id_password">Password</label>
        {{ form.password }}
    </div>
    <div style="text-align: right; margin-top: 8px;">
    <a href="{% url 'password_reset' %}"
       style="color: #667eea; text-decoration: none;">
        Forgot Password?
    </a>
</div>
    <input type="hidden" name="next" value="{{ next }}">

    <button type="submit" class="login-btn">
        Login
    </button>
</form>

<div class="bottom-text">
    Login to access your customer account.
</div>

</div></body>
</html>
